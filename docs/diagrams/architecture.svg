<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1090" width="1400" role="img" aria-labelledby="t d"><title id="t">VLMAutoReplayTool の構成</title><desc id="d">基盤モデルは、型つきの 9 つの関数(prompts)を通して、計画だけを受け持つ。メインループが、画面を撮り、次の行動を選び、ActionDispatcher が、許可された API の入力か、サンドボックスで動くスクリプトのスキルを実行する。Watchdog が停滞を見張り、TODO を作り直す。</desc><style>
:root{--bg:#ffffff;--grid:#edf0f4;--ink:#1d2433;--muted:#667085;--card:#ffffff;--cardline:#d0d5dd;--lab:#ffffff;
--blue:#1a73e8;--orange:#e8710a;--teal:#0f9d8a;--red:#d92d20;--gray:#667085;--purple:#7a5af8;
--f-blue:#f3f7fe;--f-orange:#fdf6ee;--f-teal:#f0f9f7;--f-red:#fef5f4;--f-gray:#f6f7f9;--f-purple:#f6f3ff}
@media (prefers-color-scheme: dark){:root{--bg:#14171d;--grid:#1f242d;--ink:#e6e9ef;--muted:#98a2b3;--card:#1b2029;--cardline:#3a4150;--lab:#14171d;
--blue:#6ea8fe;--orange:#f5a25d;--teal:#52c7b4;--red:#f97066;--gray:#98a2b3;--purple:#a99bff;
--f-blue:#17202e;--f-orange:#271f17;--f-teal:#152422;--f-red:#2a1b1a;--f-gray:#1a1e26;--f-purple:#1f1b2e}}
text{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;fill:var(--ink)}
.mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,"Courier New",monospace}
.title{font-size:16px;font-weight:600;text-anchor:middle}
.sub{font-size:11.5px;text-anchor:middle;fill:var(--muted)}
.glabel{font-size:12.5px;font-weight:700;letter-spacing:.08em}
.alabel{font-size:12px;text-anchor:middle;fill:var(--muted)}
.alabel.blue{fill:var(--blue)} .alabel.orange{fill:var(--orange)} .alabel.red{fill:var(--red)}
.note{font-size:12px;fill:var(--muted)}
.hd{font-size:20px;font-weight:700}
.card{fill:var(--card);stroke:var(--cardline);stroke-width:1.2}
.ic{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ic .fill{fill:var(--ink);stroke:none}
.lab{fill:var(--lab)}
.a{fill:none;stroke-width:2}
.a.primary{stroke:var(--blue)} .a.secondary{stroke:var(--gray);stroke-dasharray:6 5} .a.accent{stroke:var(--orange)} .a.danger{stroke:var(--red);stroke-dasharray:6 5}
.h.primary{fill:var(--blue)} .h.secondary{fill:var(--gray)} .h.accent{fill:var(--orange)} .h.danger{fill:var(--red)}
.badge{font-size:11px;font-weight:700;text-anchor:middle;fill:#fff}
</style><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="1400" height="1090" fill="var(--bg)"/><rect width="1400" height="1090" fill="url(#g)"/><rect x="40" y="100" width="250" height="740" rx="14" fill="var(--f-purple)" stroke="var(--purple)" stroke-width="1.5"/><rect x="62" y="90" width="135.0" height="20" fill="var(--bg)"/><text class="glabel mono" x="68" y="104.5" style="fill:var(--purple)">PLAN — 計画(モデル側)</text><rect x="480" y="100" width="860" height="740" rx="14" fill="var(--f-teal)" stroke="var(--teal)" stroke-width="1.5"/><rect x="502" y="90" width="225.2" height="20" fill="var(--bg)"/><text class="glabel mono" x="508" y="104.5" style="fill:var(--teal)">RUN — 実行(loop/ + actions/)</text><rect x="480" y="890" width="860" height="160" rx="14" fill="var(--f-blue)" stroke="var(--blue)" stroke-width="1.5"/><rect x="502" y="880" width="176.0" height="20" fill="var(--bg)"/><text class="glabel mono" x="508" y="894.5" style="fill:var(--blue)">GUI — FastAPI + 静的画面</text><path class="a primary" d="M118.0 190.0 L70.0 190.0 L70.0 340.0 L118.0 340.0"/><path class="h primary" d="M118.0 340.0 L107.0 334.5 L107.0 345.5 Z"/><path class="a primary" d="M182.0 340.0 L608.0 340.0"/><path class="h primary" d="M608.0 340.0 L597.0 334.5 L597.0 345.5 Z"/><path class="h primary" d="M182.0 340.0 L193.0 345.5 L193.0 334.5 Z"/><path class="a primary" d="M672.0 340.0 L868.0 340.0"/><path class="h primary" d="M868.0 340.0 L857.0 334.5 L857.0 345.5 Z"/><path class="h primary" d="M672.0 340.0 L683.0 345.5 L683.0 334.5 Z"/><path class="a primary" d="M640.0 308.0 L640.0 210.0 L1160.0 210.0 L1160.0 308.0"/><path class="h primary" d="M1160.0 308.0 L1165.5 297.0 L1154.5 297.0 Z"/><path class="a primary" d="M1192.0 340.0 L1280.0 340.0 L1280.0 430.0 L1160.0 430.0 L1160.0 528.0"/><path class="h primary" d="M1160.0 528.0 L1165.5 517.0 L1154.5 517.0 Z"/><path class="a primary" d="M1128.0 340.0 L1040.0 340.0 L1040.0 440.0 L900.0 440.0 L900.0 528.0"/><path class="h primary" d="M900.0 528.0 L905.5 517.0 L894.5 517.0 Z"/><path class="a primary" d="M932.0 560.0 L1128.0 560.0"/><path class="h primary" d="M1128.0 560.0 L1117.0 554.5 L1117.0 565.5 Z"/><path class="a primary" d="M1192.0 560.0 L1280.0 560.0 L1280.0 720.0 L1192.0 720.0"/><path class="h primary" d="M1192.0 720.0 L1203.0 725.5 L1203.0 714.5 Z"/><path class="a secondary" d="M640.0 445.0 L640.0 528.0"/><path class="h secondary" d="M640.0 528.0 L645.5 517.0 L634.5 517.0 Z"/><rect class="card" x="118.0" y="158.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(130.0 170.0) scale(1.000)"><path d="M11 31a7 7 0 0 1 0-14 9 9 0 0 1 17-2 7.500 7.500 0 0 1 1 16z"/></g><rect class="card" x="118.0" y="308.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(130.0 320.0) scale(1.000)"><path d="M14 11h22M14 20h22M14 29h22"/><circle class="fill" cx="7" cy="11" r="2"/><circle class="fill" cx="7" cy="20" r="2"/><circle class="fill" cx="7" cy="29" r="2"/></g><rect class="card" x="118.0" y="458.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(130.0 470.0) scale(1.000)"><path d="M10 4h14l8 8v24H10z"/><path d="M24 4v8h8M15 20h12M15 26h12M15 32h8"/></g><rect class="card" x="118.0" y="608.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(130.0 620.0) scale(1.000)"><circle cx="20" cy="20" r="15"/><path d="M12 20l6 6 11-12"/></g><rect class="card" x="608.0" y="308.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 320.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M11 16l6 5-6 5M21 27h8"/></g><rect class="card" x="868.0" y="308.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 320.0) scale(1.000)"><path d="M3 21h8l4-12 6 24 5-16 3 4h8"/></g><rect class="card" x="1128.0" y="308.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 320.0) scale(1.000)"><circle cx="20" cy="20" r="6"/><path d="M20 4v6M20 30v6M4 20h6M30 20h6M8.7 8.7l4.2 4.2M27.1 27.1l4.2 4.2M31.3 8.7l-4.2 4.2M12.9 27.1l-4.2 4.2"/></g><rect class="card" x="868.0" y="528.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 540.0) scale(1.000)"><rect x="8" y="17" width="24" height="17" rx="3"/><path d="M13 17v-4a7 7 0 0 1 14 0v4"/><circle class="fill" cx="20" cy="25.500" r="2"/></g><rect class="card" x="1128.0" y="528.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 540.0) scale(1.000)"><path d="M7 17v6M12.5 11v18M18 6v28M23.5 13v14M29 9v22M34 16v8"/></g><rect class="card" x="1128.0" y="688.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 700.0) scale(1.000)"><rect x="4" y="9" width="32" height="22" rx="4"/><path d="M17 15l9 5-9 5z"/></g><rect class="card" x="608.0" y="528.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 540.0) scale(1.000)"><ellipse cx="20" cy="9" rx="13" ry="4.5"/><path d="M7 9v22c0 2.5 5.8 4.5 13 4.5S33 33.500 33 31V9M7 20c0 2.5 5.8 4.500 13 4.500S33 22.500 33 20"/></g><rect class="card" x="608.0" y="923.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(620.0 935.0) scale(1.000)"><rect x="4" y="7" width="32" height="26" rx="4"/><path d="M4 15h32"/><circle class="fill" cx="9" cy="11" r="1.2"/><circle class="fill" cx="13.5" cy="11" r="1.2"/></g><rect class="card" x="868.0" y="923.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(880.0 935.0) scale(1.000)"><path d="M5 5v30h30"/><path d="M10 27l7-9 6 5 9-14"/></g><rect class="card" x="1128.0" y="923.0" width="64" height="64" rx="12"/><g class="ic" transform="translate(1140.0 935.0) scale(1.000)"><path d="M20 4l13 5v10c0 8-5.500 13.500-13 17C12.500 32.500 7 27 7 19V9z"/><path d="M14 20l4 4 8-9"/></g><text class="title" x="150" y="242.0">基盤モデル(VLM)</text><text class="sub mono" x="150" y="261.0">FoundationModelClient</text><text class="sub mono" x="150" y="276.0">(Protocol・差し替え可)</text><text class="title" x="150" y="392.0">prompts/</text><text class="sub mono" x="150" y="411.0">9 つの型つきの関数</text><text class="sub mono" x="150" y="426.0">Pydantic で検証</text><text class="title" x="150" y="542.0">knowledge/</text><text class="sub mono" x="150" y="561.0">RAG は TODO 生成の前だけ</text><text class="sub mono" x="150" y="576.0">docs・experience</text><text class="title" x="150" y="692.0">skills/</text><text class="sub mono" x="150" y="711.0">自動抽出 +</text><text class="sub mono" x="150" y="726.0">ホールドアウトの受け入れ</text><text class="title" x="640" y="392.0">MainLoop</text><text class="sub mono" x="640" y="411.0">撮る→選ぶ→実行→確認</text><text class="sub mono" x="640" y="426.0">理由が空なら実行しない</text><text class="title" x="900" y="392.0">Watchdog</text><text class="sub mono" x="900" y="411.0">診断 or 15 ステップで</text><text class="sub mono" x="900" y="426.0">TODO を作り直す</text><text class="title" x="1160" y="392.0">ActionDispatcher</text><text class="sub mono" x="1160" y="411.0">api / skill の振り分け</text><text class="sub mono" x="1160" y="426.0">API は許可リストだけ</text><text class="title" x="900" y="612.0">ScriptSandbox</text><text class="sub mono" x="900" y="631.0">制限した exec</text><text class="sub mono" x="900" y="646.0">(ブロックリスト方式)</text><text class="title" x="1160" y="612.0">ApiPrimitives</text><text class="sub mono" x="1160" y="631.0">パッド・キー・マウス</text><text class="sub mono" x="1160" y="646.0">OCR・移動</text><text class="title" x="1160" y="772.0">ゲーム</text><text class="sub mono" x="1160" y="791.0">実機: ViGEm・SendInput</text><text class="sub mono" x="1160" y="806.0">デモ: DemoGame</text><text class="title" x="640" y="612.0">StepLog</text><text class="sub mono" x="640" y="631.0">理由・行動・結果の要約</text><text class="sub mono" x="640" y="646.0">画像は参照で保存</text><text class="title" x="640" y="1007.0">操作パネル</text><text class="sub mono" x="640" y="1026.0">operator: 実行の開始・停止</text><text class="title" x="900" y="1007.0">監視 HUD</text><text class="sub mono" x="900" y="1026.0">WebSocket・本番は既定で無効</text><text class="title" x="1160" y="1007.0">認証・監査</text><text class="sub mono" x="1160" y="1026.0">viewer / operator / admin</text><rect class="lab" x="54.7" y="286.0" width="74.6" height="16" rx="3"/><text class="alabel mono blue" x="92.0" y="298.0">complete()</text><rect class="lab" x="328.8" y="321.0" width="132.4" height="16" rx="3"/><text class="alabel mono blue" x="395.0" y="333.0">次の行動・理由・要約</text><rect class="lab" x="737.3" y="321.0" width="65.4" height="16" rx="3"/><text class="alabel mono blue" x="770.0" y="333.0">介入する?</text><rect class="lab" x="864.4" y="189.0" width="71.2" height="16" rx="3"/><text class="alabel mono blue" x="900.0" y="201.0">行動を実行</text><rect class="lab" x="1221.3" y="319.0" width="29.4" height="16" rx="3"/><text class="alabel mono blue" x="1236.0" y="331.0">api</text><rect class="lab" x="974.0" y="369.0" width="91.9" height="16" rx="3"/><text class="alabel mono blue" x="1020.0" y="381.0">script スキル</text><rect class="lab" x="987.6" y="541.0" width="84.8" height="16" rx="3"/><text class="alabel mono blue" x="1030.0" y="553.0">api 経由だけ</text><rect class="lab" x="1236.8" y="629.0" width="34.5" height="16" rx="3"/><text class="alabel mono blue" x="1254.0" y="641.0">入力</text><rect class="lab" x="644.8" y="475.5" width="34.5" height="16" rx="3"/><text class="alabel mono " x="662.0" y="487.5">ログ</text><text class="hd" x="40" y="44" text-anchor="start">VLMAutoReplayTool — 構成</text><text class="note" x="40" y="66" text-anchor="start">青=主な流れ / 灰の破線=補助。計画(モデル)と実行(専用の部品)を分ける。モデルは Protocol 越しで差し替えられる</text><text class="note" x="500" y="825" text-anchor="start">GUI(gui/): 操作・HUD・認証・監査。ただし GUI の実行は、いまはデモのゲーム・デモのモデルだけ</text></svg>
