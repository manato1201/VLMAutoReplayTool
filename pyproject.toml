[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-auto-replay-tool"
version = "0.1.0"
description = "基盤モデルによる計画と専用モデルによる実行を分離したゲーム自動プレイエージェント(コア骨格実装: Phase1-5)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
# Windows実機HID実行(Phase3)。ViGEmBusドライバのインストールが別途必要。
hid = ["vgamepad>=0.0.8"]
# 画面キャプチャ・OCRの実バックエンド(Phase3/7)。
vision = ["mss>=9.0", "pillow>=10.0"]
# 操作用GUI(FastAPIダッシュボード)。
gui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "S", "B"]
# S101: pytestはassertを多用するテストコードのため無効化。
# S105/S106: パッド/キーボードの"パスワードらしき文字列"誤検知を避けるため無効化。
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
# テストは1行に収めた方が可読性が高いケースが多いため行長制限を緩める。
"tests/**" = ["S101", "E501"]
