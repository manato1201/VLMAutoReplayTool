<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VLM Auto Replay — Monitoring HUD</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topnav">
    <div class="brand">VLM <span class="chip-lime">AUTO</span> REPLAY <span style="opacity:.6;font-weight:400;">/ HUD</span></div>
    <a href="/index.html" class="eyebrow" style="text-decoration:none;">← 操作パネルに戻る</a>
  </header>

  <main class="hud-body">
    <div class="hud-header">
      <div class="segment-rail" role="tablist" aria-label="HUDビュー切り替え">
        <button type="button" data-view="todo" aria-selected="true">TODOビュー</button>
        <button type="button" data-view="steplog" aria-selected="false">StepLogビュー</button>
        <button type="button" data-view="skills" aria-selected="false">Skillライブラリビュー</button>
      </div>

      <div style="display:flex; align-items:center; gap:16px;">
        <div class="radial-progress">
          <svg viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="16" stroke="var(--ring-track)" fill="none" stroke-width="4" />
            <circle id="radial-fill" cx="20" cy="20" r="16" stroke="var(--ring-fill)" fill="none" stroke-width="4"
              stroke-dasharray="100.5" stroke-dashoffset="100.5" stroke-linecap="round" />
          </svg>
          <span id="radial-label" class="radial-progress-label">0 / 0</span>
        </div>
        <span id="ws-status" class="hud-ws-status">WS: 接続中…</span>
      </div>
    </div>

    <section id="view-todo" class="hud-view panel">
      <h2 class="panel-title">TODOビュー</h2>
      <p class="caption">直近のStepLog.todoIdと一致するTODOをフォーカスリングで示す(Phase2のログのみを真実とする)。</p>
      <div id="hud-todo-list" class="todo-list"></div>
    </section>

    <section id="view-steplog" class="hud-view panel" hidden>
      <h2 class="panel-title">StepLogビュー</h2>
      <p class="caption">stepIndex順のドットチャート。赤はWatchdogが介入したステップ。</p>
      <div id="hud-dot-chart" class="dot-chart"></div>
      <div id="hud-log-feed" class="log-feed"></div>
    </section>

    <section id="view-skills" class="hud-view panel" hidden>
      <h2 class="panel-title">Skillライブラリビュー</h2>
      <div id="hud-skill-list" class="skill-list"></div>
    </section>
  </main>

  <div id="toast-stack" class="toast-stack"></div>

  <script src="/auth.js"></script>
  <script src="/hud.js"></script>
</body>
</html>
