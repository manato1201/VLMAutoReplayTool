<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VLM Auto Replay — Admin</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topnav">
    <div class="brand">VLM <span class="chip-lime">AUTO</span> REPLAY <span style="opacity:.6;font-weight:400;">/ ADMIN</span></div>
    <a href="/index.html" class="eyebrow" style="text-decoration:none;">← 操作パネルに戻る</a>
  </header>

  <main class="layout">
    <!-- 管理画面: admin だけ(サーバーが /admin.html・/admin.js を admin に限る)。操作パネルには、この画面のコードを載せない。 -->
    <section class="panel">
      <h2 class="panel-title">スキルライブラリ(追加・削除)</h2>
      <p class="caption">procedureスキル(非強制の手順書)をその場で追加できる。</p>
      <div class="skill-form">
        <input id="skill-game-title" class="text-input" type="text" placeholder="対象ゲーム名(例: MyGame)" />
        <textarea id="skill-procedural-text" class="text-input skill-textarea" rows="3" placeholder="手順テキスト(例: 1. 敵を確認する&#10;2. 攻撃する)"></textarea>
        <button id="add-skill-btn" class="btn-small">スキルを追加</button>
        <span id="skill-error" class="error-text"></span>
      </div>
      <div id="skill-list" class="skill-list"></div>
    </section>

    <section class="panel panel-wide">
      <h2 class="panel-title">設定: HIDバックエンド</h2>
      <p class="caption">
        Phase3の実HID実装(<code>actions/api_primitives.py</code>)をこの環境で実際に構築できるか確認する。
        デモ実行(StepLog)はDemoGameの決定的スタブを使うため、ここでの選択には影響しない —
        実運用でScreenCapture/ActionExecutorを実キャプチャに差し替えた際の設定の起点になる。
      </p>
      <div id="hid-backend-options" class="hid-backend-options"></div>
      <span id="hid-backend-error" class="error-text"></span>
    </section>
  </main>

  <script src="/auth.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
